name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    name: test scripts (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The official installer puts bun at ~/.bun/bin, which is where the scripts look for it.
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Show the tools the tests use
        run: |
          sw_vers
          for t in zsh swift bun jq plutil defaults security; do printf '%-9s %s\n' "$t" "$(command -v "$t" || echo MISSING)"; done
          swift --version

      # Left out on purpose: tests/secrets-roundtrip.sh needs age, and tests/local-no-rclone.sh
      # needs gitleaks; neither comes with a runner. Everything else needs only the tools above.
      - name: Run the test scripts
        run: |
          status=0
          for t in app-backup app-schedule app-setup-files due hosts nogit-backup omo-anthropic \
                   profiles settings snapshot status storage-app storage-backend; do
            echo "::group::tests/$t.sh"
            zsh "tests/$t.sh" || { status=1; echo "::error::tests/$t.sh failed"; }
            echo "::endgroup::"
          done
          exit $status
